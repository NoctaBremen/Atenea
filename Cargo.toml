[package]
name = "atenea"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
default-run = "atenea"
description = "Explorador de vinilos sobre los dumps de Discogs (Rust + GTK4)"
license = "MIT"
repository = "https://github.com/NoctaBremen/Atenea"
authors = ["David Gimenez (director del proyecto)", "Claude, de Anthropic (programación)"]

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
flate2 = "1.1.11"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
quick-xml = "0.42.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
