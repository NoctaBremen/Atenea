[package]
name = "atenea"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
