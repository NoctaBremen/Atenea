<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Vault: la puerta de una cámara acorazada que es un disco de vinilo, con el volante de
       apertura sobre la etiqueta. Colores de Dracula. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343746"/>
      <stop offset="1" stop-color="#21222c"/>
    </linearGradient>
    <radialGradient id="disco" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#2b2d3a"/>
      <stop offset="1" stop-color="#15161d"/>
    </radialGradient>
    <linearGradient id="etiqueta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6b4ff"/>
      <stop offset="1" stop-color="#9d6cf0"/>
    </linearGradient>
  </defs>

  <!-- Marco de la cámara -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#fondo)"/>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="none" stroke="#44475a" stroke-width="3"/>

  <!-- Bisagras -->
  <rect x="20" y="70" width="16" height="30" rx="5" fill="#6272a4"/>
  <rect x="20" y="156" width="16" height="30" rx="5" fill="#6272a4"/>

  <!-- Puerta = disco -->
  <circle cx="132" cy="128" r="100" fill="url(#disco)" stroke="#6272a4" stroke-width="5"/>
  <!-- Pernos del cierre alrededor de la puerta -->
  <g fill="#8be9fd">
    <circle cx="132" cy="36" r="5"/>
    <circle cx="132" cy="220" r="5"/>
    <circle cx="40" cy="128" r="5"/>
    <circle cx="224" cy="128" r="5"/>
    <circle cx="67" cy="63" r="5"/>
    <circle cx="197" cy="63" r="5"/>
    <circle cx="67" cy="193" r="5"/>
    <circle cx="197" cy="193" r="5"/>
  </g>
  <!-- Surcos -->
  <g fill="none" stroke="#3a3c4e" stroke-width="2">
    <circle cx="132" cy="128" r="84"/>
    <circle cx="132" cy="128" r="74"/>
    <circle cx="132" cy="128" r="64"/>
    <circle cx="132" cy="128" r="54"/>
  </g>
  <!-- Brillo -->
  <path d="M74 86 A72 72 0 0 1 132 56" fill="none" stroke="#6272a4" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M190 170 A72 72 0 0 1 160 194" fill="none" stroke="#6272a4" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Etiqueta -->
  <circle cx="132" cy="128" r="40" fill="url(#etiqueta)"/>
  <!-- Volante de apertura: tres radios con pomos -->
  <g stroke="#21222c" stroke-width="6" stroke-linecap="round">
    <line x1="132" y1="128" x2="132" y2="98"/>
    <line x1="132" y1="128" x2="158" y2="143"/>
    <line x1="132" y1="128" x2="106" y2="143"/>
  </g>
  <g fill="#21222c">
    <circle cx="132" cy="96" r="6"/>
    <circle cx="160" cy="144" r="6"/>
    <circle cx="104" cy="144" r="6"/>
    <circle cx="132" cy="128" r="10"/>
  </g>
  <!-- Agujero central del disco -->
  <circle cx="132" cy="128" r="4" fill="#bd93f9"/>
</svg>
